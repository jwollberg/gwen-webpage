name: Publish site

# GitHub builds the site; Vault (Josh's home server) serves it. The vault job pushes the finished
# pages as one commit to the site branch, which Vault copies within two minutes
# (jwollberg/atheos-home, AtheosHome/vault/README.md, "Public websites"). GitHub Pages was turned
# off on 2026-11-25.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gweneveregreenwood.com' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}

      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  vault:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Get the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Publish it to the site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
